<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OutofStep.tv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: streaming home — fixed nav, billboard with muted preview, rows of covers with hover cards, Top 10 and box-art rows; detail modal; full-screen player with up-next rail. */
:root {
  --bg: #0b0c0e;
  --bg-2: #141619;
  --card: #1b1e23;
  --line: #2a2e35;
  --ink: #f3efe7;
  --dim: #a0a5ad;
  --faint: #6c727b;
  --amber: #f2a93b;
  --amber-ink: #1a1206;
  --good: #5fd38d;
  --rec: #ff5a4e;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gutter: clamp(16px, 4vw, 60px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4; }
body { overflow-x: hidden; }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
:root[data-sec="music"] { --amber: #ff5c8a; --amber-ink: #23040f; }
.sec-switch { display: inline-flex; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex: none; }
.sec-switch button { background: none; border: 0; border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.sec-switch button.on { background: var(--amber); color: var(--amber-ink); }
.sec-switch button:not(.on):hover { color: var(--ink); }
.chooser { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; }
.chooser .in { display: grid; gap: clamp(20px, 4vh, 40px); justify-items: center; width: min(1000px, 100%); }
.chooser .lg { font-family: var(--f-display); font-weight: 900; font-size: 30px; text-transform: uppercase; }
.chooser .lg b { color: #f2a93b; }
.chooser h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 5vw, 64px); text-transform: uppercase; line-height: .9; text-align: center; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 2.5vw, 28px); width: 100%; }
.choice { position: relative; aspect-ratio: 4 / 5; border: 0; padding: 0; border-radius: 8px; overflow: hidden; background: #000; text-align: left; outline: 3px solid transparent; transition: outline-color .2s, transform .25s; }
.choice:hover, .choice:focus-visible { outline-color: var(--c); transform: translateY(-4px); }
.choice img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.9) brightness(.62); transition: filter .3s; }
.choice:hover img { filter: saturate(1.05) brightness(.8); }
.choice .tx { position: absolute; left: 0; right: 0; bottom: 0; padding: clamp(14px, 3vw, 28px); display: grid; gap: 6px; background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); }
.choice .tx b { font-family: var(--f-display); font-weight: 900; font-size: clamp(36px, 7vw, 84px); line-height: .85; text-transform: uppercase; color: var(--ink); }
.choice .tx span { font-family: var(--f-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.choice .tx small { color: #ddd; font-size: 15px; }
.cap .tl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cap .tt { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap .ar { display: block; font-size: 12px; font-weight: 600; color: var(--amber); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1px; }

/* ---------- nav ---------- */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; align-items: center; gap: 28px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) var(--gutter) 16px;
  background: linear-gradient(180deg, rgba(11,12,14,.85) 10%, rgba(11,12,14,0)); transition: background .3s; }
.nav.solid { background: var(--bg); }
.logo { font-family: var(--f-display); font-weight: 900; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; line-height: .9; white-space: nowrap; background: none; border: 0; padding: 0; }
.logo b { color: var(--amber); font-weight: 900; }
.logo .lg-short { display: none; }
.menu-btn { display: none; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.08); padding: 0; flex: none; }
.menu-btn path { transition: transform .25s ease, opacity .2s; transform-origin: 12px 12px; }
.menu-btn[aria-expanded="true"] .l1 { transform: translateY(5px) rotate(45deg); }
.menu-btn[aria-expanded="true"] .l2 { opacity: 0; }
.menu-btn[aria-expanded="true"] .l3 { transform: translateY(-5px) rotate(-45deg); }
.mmenu { position: fixed; inset: 0; z-index: 39; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 84px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 28px); display: flex; flex-direction: column; gap: 28px; animation: mmIn .22s ease-out; }
@keyframes mmIn { from { opacity: 0; } }
.mm-search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--bg-2); }
.mm-search:focus-within { border-color: var(--ink); }
.mm-search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--ink); font: inherit; font-size: 17px; }
.mm-links { display: grid; gap: 2px; }
.mm-links button { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; text-align: left; font-family: var(--f-display); font-weight: 900; font-size: 44px; line-height: .95; text-transform: uppercase; color: var(--ink); animation: bIn .3s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
.mm-links button small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; letter-spacing: .1em; color: var(--dim); }
.mm-links button.on { color: var(--amber); }
.mm-links button:active { color: var(--amber); }
.mm-foot { display: grid; gap: 10px; margin-top: auto; }
.mm-live, .mm-np { display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 8px; padding: 14px; font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.mm-live { background: var(--ink); color: #000; }
.mm-live i { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 10px var(--rec); animation: pulse 2s infinite; }
.mm-live span { font-family: var(--f-mono); font-weight: 400; letter-spacing: .06em; opacity: .6; }
.mm-np { background: var(--amber); color: var(--amber-ink); }
.mm-np .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; } .mm-np .eq i { width: 3px; background: currentColor; animation: eq 1s ease-in-out infinite; } .mm-np .eq i:nth-child(2) { animation-delay: -.4s; } .mm-np .eq i:nth-child(3) { animation-delay: -.7s; }
.links { display: flex; gap: 20px; font-size: 15px; color: #d6d2ca; }
.links button { background: none; border: 0; padding: 4px 0; color: inherit; font-weight: 500; }
.links button.on { color: var(--ink); font-weight: 700; }
.links button:hover { color: var(--faint); }
.spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; padding: 6px 8px; min-width: 0; transition: border-color .2s, background .2s; }
.search.open { border-color: var(--ink); background: rgba(0,0,0,.75); }
.search button { background: none; border: 0; padding: 0; display: grid; place-items: center; }
.search input { background: none; border: 0; color: var(--ink); font: inherit; width: 0; outline: none; min-width: 0; transition: width .25s; }
.search.open input { width: 220px; }
.search:not(.open) input { display: none; }
.live-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.live-btn i { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 10px var(--rec); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- billboard ---------- */
.billboard { position: relative; height: 56.25vw; max-height: 92vh; min-height: 540px; overflow: hidden; }
.bb-media { position: absolute; inset: 0; will-change: transform; transform-origin: center top; }
.bb-copy, .bb-side { will-change: transform, opacity; }
.bb-img { position: absolute; inset: 0; background-size: cover; background-position: center 25%; transition: opacity 1s; }
.bb-video { position: absolute; left: 50%; top: 50%; width: max(100%, calc(100vh * 16 / 9 * 1.2)); aspect-ratio: 16/9; transform: translate(-50%, -50%) scale(1.18); opacity: 0; transition: opacity 1.2s; pointer-events: none; }
.bb-video.on { opacity: 1; }
.bb-video iframe, .bb-video > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.billboard::after { content: ""; position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(77deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.25) 45%, rgba(0,0,0,0) 70%),
  linear-gradient(0deg, var(--bg) 0%, rgba(11,12,14,.6) 10%, rgba(11,12,14,0) 30%); }
.bb-copy { position: absolute; left: var(--gutter); bottom: 32%; z-index: 2; width: min(40vw, 620px); display: grid; gap: 16px; }
.bb-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-family: var(--f-mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.bb-kicker b { color: var(--amber); font-weight: 500; }
.bb-title { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(40px, 6.2vw, 108px); line-height: .86; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; text-shadow: 0 2px 30px rgba(0,0,0,.5); transition: font-size .8s, opacity .8s; }
.bb-desc { margin: 0; font-size: clamp(15px, 1.25vw, 20px); line-height: 1.35; text-shadow: 0 1px 6px rgba(0,0,0,.6); max-width: 46ch; transition: opacity .8s, max-height .8s; max-height: 8em; overflow: hidden; }
.billboard.previewing .bb-desc { opacity: 0; max-height: 0; }
.bb-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; padding-bottom: .04em; }
.bb-title[data-len="l"] { font-size: clamp(34px, 4.8vw, 84px); }
.bb-title[data-len="xl"] { font-size: clamp(28px, 3.6vw, 62px); line-height: .92; }
.billboard.previewing .bb-title[data-len] { font-size: clamp(26px, 3.4vw, 56px); }
.billboard.previewing .bb-title { font-size: clamp(32px, 4.4vw, 76px); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 5px; padding: 11px 26px 11px 20px; font-weight: 700; font-size: clamp(15px, 1.2vw, 19px); }
.btn.primary { background: var(--ink); color: #000; }
.btn.primary:hover { background: rgba(243,239,231,.78); }
.btn.ghost { background: rgba(109,109,110,.7); color: var(--ink); }
.btn.ghost:hover { background: rgba(109,109,110,.45); }
.btn svg { flex: none; }
.bb-side { position: absolute; right: 0; bottom: 32%; z-index: 2; display: flex; align-items: center; gap: 12px; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.6); background: rgba(0,0,0,.2); display: grid; place-items: center; flex: none; }
.round:hover { border-color: var(--ink); background: rgba(255,255,255,.12); }
.badge-tab { background: rgba(51,51,51,.6); border-left: 3px solid var(--ink); padding: 6px 60px 6px 12px; font-family: var(--f-mono); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }

/* ---------- rows ---------- */
main { position: relative; z-index: 3; margin-top: -12vw; padding-bottom: 80px; display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(28px, 3.4vw, 48px); }
.row { display: grid; gap: 10px; min-width: 0; }
.row-head { display: flex; align-items: baseline; gap: 14px; padding: 0 var(--gutter); }
.row-head h2 { margin: 0; font-family: var(--f-body); font-weight: 700; font-size: clamp(17px, 1.5vw, 22px); }
.row-head .explore { background: none; border: 0; padding: 0; color: var(--amber); font-size: 13px; font-weight: 700; opacity: 0; transform: translateX(-8px); transition: .25s; }
.row:hover .explore { opacity: 1; transform: none; }
.pager { margin-left: auto; display: flex; gap: 3px; opacity: 0; transition: opacity .2s; }
.row:hover .pager { opacity: 1; }
.pager i { width: 12px; height: 2px; background: #4d4d4d; }
.pager i.on { background: #aaa; }
.slider { position: relative; min-width: 0; }
.track { display: grid; grid-auto-flow: column; gap: 8px; overflow-x: auto; overflow-y: hidden; touch-action: pan-x pan-y; scroll-snap-type: x mandatory; scroll-padding: 0 var(--gutter); padding: 0 var(--gutter); scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.track.wide { grid-auto-columns: calc((100vw - 2 * var(--gutter) - 5 * 8px) / 6); }
.track.tall { grid-auto-columns: calc((100vw - 2 * var(--gutter) - 6 * 8px) / 7); }
.track.top { grid-auto-columns: calc((100vw - 2 * var(--gutter) - 4 * 8px) / 5); }
.handle { position: absolute; top: 0; bottom: 0; width: calc(var(--gutter) - 4px); min-width: 34px; border: 0; background: rgba(11,12,14,.55); color: var(--ink); opacity: 0; transition: opacity .2s, background .2s; z-index: 4; display: grid; place-items: center; }
.handle.l { left: 0; border-radius: 0 4px 4px 0; } .handle.r { right: 0; border-radius: 4px 0 0 4px; }
.slider:hover .handle { opacity: 1; }
.handle:hover { background: rgba(11,12,14,.8); }
.handle svg { transition: transform .2s; }
.handle:hover svg { transform: scale(1.25); }

.tile { scroll-snap-align: start; position: relative; display: block; background: var(--card); border: 0; padding: 0; border-radius: 4px; overflow: hidden; min-width: 0; text-align: left; }
.tile.w { aspect-ratio: 16/9; }
.tile.t { aspect-ratio: 2/3; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); font-weight: 700; font-size: 14px; line-height: 1.15; display: block; overflow-wrap: anywhere; }
.tile .flag { position: absolute; left: 0; top: 8px; background: var(--amber); color: var(--amber-ink); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px 2px 6px; border-radius: 0 3px 3px 0; }
.tile .flag.dvd { background: var(--ink); color: #000; }
.tile .bar { position: absolute; left: 10px; right: 10px; bottom: 6px; height: 3px; background: rgba(255,255,255,.3); }
.tile .bar i { display: block; height: 100%; background: var(--amber); }
.tile.has-bar .cap { bottom: 8px; }

/* top 10 */
.top-item { scroll-snap-align: start; position: relative; display: grid; grid-template-columns: 48% 52%; align-items: end; background: none; border: 0; padding: 0; aspect-ratio: 1.4 / 1; min-width: 0; }
.top-item .num { font-family: var(--f-display); font-weight: 900; font-size: clamp(110px, 15vw, 260px); line-height: .78; color: var(--bg); -webkit-text-stroke: 4px #595959; text-align: right; letter-spacing: -.06em; margin-right: -8%; user-select: none; }
.top-item .tile { aspect-ratio: 2/3; height: 100%; width: auto; justify-self: start; }

/* hover card */
.bob { position: fixed; z-index: 30; width: 340px; background: var(--bg-2); border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.75); overflow: hidden; opacity: 0; transform: scale(.72); transition: opacity .18s, transform .22s; pointer-events: none; }
.bob.on { opacity: 1; transform: scale(1); pointer-events: auto; }
.bob .media { position: relative; aspect-ratio: 16/9; background: #000; }
.bob .media img { width: 100%; height: 100%; object-fit: cover; }
.bob .media .t { position: absolute; left: 12px; right: 12px; bottom: 8px; font-family: var(--f-display); font-weight: 900; font-size: 24px; line-height: .92; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.8); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bob .body { padding: 14px 14px 16px; display: grid; gap: 10px; }
.bob .btns { display: flex; gap: 8px; align-items: center; }
.bob .btns .round { width: 38px; height: 38px; }
.bob .btns .round.fill { background: var(--ink); color: #000; border-color: var(--ink); }
.bob .btns .round.fill:hover { background: rgba(243,239,231,.8); }
.bob .btns .grow { flex: 1; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; color: var(--dim); }
.facts .hot { color: var(--good); font-weight: 700; }
.facts .box { border: 1px solid rgba(255,255,255,.4); padding: 0 5px; font-size: 12px; border-radius: 2px; color: var(--ink); }
.genres { font-size: 14px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.genres span + span::before { content: "•"; color: var(--faint); margin-right: 8px; }

/* ---------- detail modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.7); overflow-y: auto; padding: 36px 16px 60px; }
.modal { position: relative; margin: 0 auto; max-width: 900px; background: var(--bg-2); border-radius: 8px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(24px) scale(.97); opacity: 0; } }
.m-hero { position: relative; aspect-ratio: 16/9; background: #000; }
.m-hero img { width: 100%; height: 100%; object-fit: cover; }
.m-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg-2) 0%, rgba(20,22,25,0) 55%); }
.m-hero .copy { position: absolute; left: 44px; right: 44px; bottom: 36px; z-index: 2; display: grid; gap: 18px; }
.m-hero .copy h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(32px, 5vw, 60px); line-height: .88; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; max-width: 18ch; }
.m-close { position: absolute; top: 14px; right: 14px; z-index: 3; width: 38px; height: 38px; border-radius: 50%; border: 0; background: #181818; display: grid; place-items: center; }
.m-body { padding: 0 44px 40px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 28px; }
.m-body p { margin: 0; font-size: 16px; line-height: 1.5; }
.m-side { display: grid; gap: 12px; align-content: start; font-size: 14px; color: var(--faint); }
.m-side b { color: var(--ink); font-weight: 500; }
.boxart { width: 100%; max-width: 220px; aspect-ratio: 2/3; object-fit: cover; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.6); transform: rotate(-1.5deg); }
.m-more { padding: 0 44px 44px; display: grid; gap: 16px; }
.m-more h3 { margin: 0; font-size: 22px; font-weight: 700; }
.m-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 14px; }
.m-card { background: #2a2c30; border: 0; border-radius: 6px; overflow: hidden; padding: 0; text-align: left; display: grid; }
.m-card .im { position: relative; aspect-ratio: 16/9; }
.m-card .im img { width: 100%; height: 100%; object-fit: cover; }
.m-card .im span { position: absolute; right: 8px; top: 8px; font-family: var(--f-mono); font-size: 12px; background: rgba(0,0,0,.75); padding: 1px 6px; border-radius: 3px; }
.m-card .tx { padding: 12px; display: grid; gap: 6px; }
.m-card .tx b { font-size: 15px; line-height: 1.2; overflow-wrap: anywhere; }
.m-card .tx small { color: var(--dim); font-size: 13px; }
.m-card:hover { background: #33363b; }

/* ---------- grid page ---------- */
.page { padding: 104px var(--gutter) 80px; display: grid; gap: 24px; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 20px; }
.page-head h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 4.5vw, 58px); text-transform: uppercase; line-height: .9; }
.page-head span { font-family: var(--f-mono); font-size: 13px; color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 40px 8px; }
.grid.tall { grid-template-columns: repeat(auto-fill, minmax(min(170px, 46%), 1fr)); gap: 16px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.chip:hover, .chip.on { border-color: var(--ink); background: rgba(255,255,255,.06); }
.chip b { font-family: var(--f-mono); font-weight: 400; color: var(--dim); margin-left: 6px; font-size: 12px; }
.empty { color: var(--dim); }

/* ---------- player ---------- */

<script>

const TV = (() => {
  const q = new URLSearchParams(location.search).get('tv');
  try { if (q === '1' || q === '0') localStorage.setItem('stv-tv', q); else if (q === 'auto') localStorage.removeItem('stv-tv'); } catch (e) {}
  let f = null; try { f = localStorage.getItem('stv-tv'); } catch (e) {}
  if (f === '1') return true; if (f === '0') return false;
  return /OutofStepTV|SmartTV|SMART-TV|Tizen|Web0S|webOS|NetCast|AFT[A-Z0-9]|BRAVIA|Android TV|GoogleTV|Google TV|CrKey|HbbTV|PhilipsTV|VIDAA|Hisense|AppleTV|Roku/i.test(navigator.userAgent);
})();
if (TV) document.documentElement.classList.add('tv', 'kb');
/* ================= auto-update =================
   Each publish stamps BUILD here and in version.json. When they differ, a newer version is live:
   reload right away when the app is reopened, or after 2 quiet minutes — never while a video is playing. */
const BUILD = '20261010180912';
(() => {
  if (!location.protocol.startsWith('http')) return;
  let quietSince = Date.now();
  ['keydown', 'pointerdown', 'wheel', 'touchstart'].forEach(e => addEventListener(e, () => { quietSince = Date.now(); }, { capture: true, passive: true }));
  async function check(reopened) {
    let j; try { j = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json(); } catch (e) { return; }
    if (!j || !j.build || j.build === BUILD) return;
    const pl = document.getElementById('player'); if (pl && !pl.hidden) return; // a video (full or mini) is up
    if (!reopened && Date.now() - quietSince < 120000) return;
    const u = new URL(location.href); u.searchParams.set('v', j.build); u.searchParams.delete('tv');
    location.replace(u.toString());
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(true); });
  setInterval(() => check(false), 5 * 60000);
  setTimeout(() => check(false), 20000);
})();
/* ================= data ================= */
const SKATE = (window.SKATE_VIDEOS || []).map(v => ({ ...v, sec: 'skate' }));
const MUSIC = (window.MUSIC_VIDEOS || []).map(v => ({ ...v, sec: 'music', ch: v.ar, tour: false, a: 0, ry: v.ry ? v.y : 0, live: v.k === 'live' }));
const SESSION = /npr|kexp|audiotree|colors/i;
const POPSKATE = /^(Blink-182|Green Day|The Offspring|Sum 41|Good Charlotte|New Found Glory|Simple Plan|Yellowcard|The Starting Line|All Time Low|The Wonder Years|Neck Deep|State Champs|The Story So Far|Real Friends|Knuckle Puck|Four Year Strong|Motion City Soundtrack|Saves the Day|MxPx|NOFX|Pennywise|Lagwagon|No Use for a Name|Strung Out|Millencolin|Face to Face|Guttermouth|Unwritten Law|Good Riddance|The Vandals|Teenage Bottlerocket|The Queers|Screeching Weasel|Me First and the Gimme Gimmes|Less Than Jake|The Interrupters)$/;
const BY = Object.fromEntries([...SKATE, ...MUSIC].map(v => [v.id, v]));
let SEC = 'skate', ALL = SKATE, PLAYABLE = SKATE.filter(v => v.e);
const $ = id => document.getElementById(id);
const cover = id => { const v = BY[id]; return v && v.sec === 'music' ? `https://i.ytimg.com/vi/${id}/${v.hq ? 'hqdefault' : 'maxresdefault'}.jpg` : `covers/${id}.jpg`; };
const art = v => v.a ? `covers/art/${TV ? 'sm/' : ''}${v.id}.jpg` : thumb(v.id);
// TV tiles use small thumbnails (about a fifth of the size) so cheap TVs don't run out of memory
const thumb = id => { if (!TV) return cover(id); const v = BY[id]; return v && v.sec === 'music' ? `https://i.ytimg.com/vi/${id}/mqdefault.jpg` : `covers/sm/${id}.jpg`; };
const isM = v => v && v.sec === 'music';
const full = v => isM(v) ? `${v.ar} – ${v.t}` : v.t;
const kindTxt = v => isM(v) ? (v.live ? 'Live set' : 'Music video') : (v.tour ? 'Tour video' : 'Full-length video');
const boxTxt = v => isM(v) ? (v.live ? 'LIVE' : 'VIDEO') : (v.tour ? 'TOUR' : 'FULL');
const MCH = { all: ['All Music', () => true], hardcore: ['Hardcore', v => v.g === 'Hardcore'], punk: ['Punk', v => v.g === 'Punk'], hiphop: ['Hip Hop', v => v.g === 'Hip Hop'] };
if (!MUSIC.some(v => v.g === 'Punk')) delete MCH.punk; // genre appears once it has videos
let liveCh = 'all'; try { liveCh = JSON.parse(localStorage.getItem('stv-mch')) || 'all'; } catch (e) {} if (!MCH[liveCh]) liveCh = 'all';
const CH = () => SEC === 'music' ? (MCH[liveCh][0] + ' Channel') : 'Channel 7';
const yti = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

const cv = $('static'), cx = cv.getContext('2d'); let st = false, raf = 0;

const sv = $('staticv'); setTimeout(() => { try { sv.preload = 'auto'; sv.load(); } catch (e) {} }, 2500); // fetch after the page has settled

const KB = () => document.documentElement.classList.contains('kb');

const visible = el => {

  const cs = getComputedStyle(el); return cs.visibility !== 'hidden' && cs.display !== 'none';

const fullPlayer = () => !$('player').hidden && !isMini();
function scopeEl() {

  if (fullPlayer()) return $('player');
  if (!$('modalwrap').hidden) return $('modalwrap');
  return document.body;
}
function candidates(scope) {
  return [...scope.querySelectorAll(FOCUSABLE)].filter(el => {
    if (el.matches('.handle, .explore, .mini-hit, #bob *') || el.closest('.bob')) return false;
    if (el.id === 'q' && !$('searchbox').classList.contains('open')) return false;
    if (scope === document.body && (el.closest('#player:not(.mini)') || el.closest('#modalwrap') || el.closest('#chooser'))) return false;
    if (el.closest('#player.mini') && !el.matches('.mini-b')) return false;

function defaultFocus(scope) {

  if (!$('homeview').hidden) return window.scrollY < innerHeight * .4 ? $('bbplay') : ($('rows').querySelector('.tile') || $('bbplay'));

}
function focusEl(el, opts = {}) {
  if (!el) return;
  el.focus({ preventScroll: true });
  ensureVisible(el, opts.instant);
  const row = el.closest('.row'); const tr = el.closest('.track');
  if (row && tr) row.dataset.fi = [...tr.children].indexOf(el.closest('.top-item') || el);
}
// TV keeps its gliding moves through and between rows (cheap for the TV to draw); other motion stays off there
const smooth = () => (TV || !reduce ? 'smooth' : 'auto');
function ensureVisible(el, instant) {
  const beh = instant ? 'auto' : smooth();
  const tr = el.closest('.track');
  if (tr) {
    const item = el.closest('.top-item') || el; const pad = parseFloat(getComputedStyle(tr).paddingLeft) || 0;
    const L = item.offsetLeft, R = L + item.offsetWidth;

    if (r.top < w.top + m) wrap.scrollBy({ top: r.top - w.top - m, behavior: beh }); else if (r.bottom > w.bottom - m) wrap.scrollBy({ top: r.bottom - w.bottom + m, behavior: beh });
    return; }

  if (el.closest('.billboard')) { window.scrollTo({ top: 0, behavior: beh }); return; }
  const row = el.closest('.row');
  if (row) { const top = row.getBoundingClientRect().top + scrollY; window.scrollTo({ top: Math.max(0, top - innerHeight * (TV ? .17 : .2)), behavior: beh }); return; }

function geoNext(from, dir, list) {
  const a = from.getBoundingClientRect(); const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for (const el of list) {
    if (el === from) continue;
    const b = el.getBoundingClientRect(); const bx = b.left + b.width / 2, by = b.top + b.height / 2;
    let main, orth;
    if (dir === 'right') { main = b.left - a.right; if (bx <= ax + 2) continue; orth = Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom)) ? Math.abs(by - ay) : 0; }
    else if (dir === 'left') { main = a.left - b.right; if (bx >= ax - 2) continue; orth = Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom)) ? Math.abs(by - ay) : 0; }
    else if (dir === 'down') { main = b.top - a.bottom; if (by <= ay + 2) continue; orth = Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right)) ? Math.abs(bx - ax) : 0; }
    else { main = a.top - b.bottom; if (by >= ay - 2) continue; orth = Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right)) ? Math.abs(bx - ax) : 0; }

function rowTarget(row) {

  const items = [...tr.children]; let i = +row.dataset.fi;
  if (!(i >= 0 && i < items.length)) { const pad = parseFloat(getComputedStyle(tr).paddingLeft) || 0; i = Math.max(0, items.findIndex(it => it.offsetLeft + it.offsetWidth / 2 >= tr.scrollLeft + pad)); }
  const it = items[Math.min(i, items.length - 1)]; return it && (it.matches('.tile') ? it : it.querySelector('.tile'));

function move(dir) {
  const scope = scopeEl(); const cur = document.activeElement;
  if (!cur || cur === document.body || !scope.contains(cur) || !visible(cur)) { focusEl(defaultFocus(scope)); return; }
  // rows: keep a tidy grid feel (left/right inside a row, up/down between rows with column memory)
  const tr = cur.closest('#rows .track');
  if (tr) {
    const row = cur.closest('.row'); const items = [...tr.children]; const i = items.indexOf(cur.closest('.top-item') || cur);

    if (sib) { focusEl(rowTarget(sib)); return; }

/* ---- back / layers (keys, remote Back, browser Back) ---- */
const focusStack = [];
function rememberFocus() {
  const a = document.activeElement; if (!a || a === document.body) return focusStack.push(null);
  const row = a.closest('.row'); focusStack.push({ el: a, id: a.dataset.id, row: row ? row.querySelector('h2').textContent : null, fi: row ? row.dataset.fi : null });
}
function restoreFocus() {
  const m = focusStack.pop();
  if (!KB()) return;
  setTimeout(() => {
    let el = m && m.el;
    if (m && el && !document.contains(el) && m.id) {
      const row = [...document.querySelectorAll('#rows .row')].find(r => r.querySelector('h2').textContent === m.row);
      if (row && m.fi != null) row.dataset.fi = m.fi;
      el = (row && row.querySelector(`.tile[data-id="${m.id}"]`)) || document.querySelector(`#rows .tile[data-id="${m.id}"], #page .tile[data-id="${m.id}"]`);
    }
    if (el && document.contains(el) && visible(el)) focusEl(el, { instant: true }); else focusEl(defaultFocus(scopeEl()), { instant: true });
  }, 30);
}
function pushLayer() { try { history.pushState({ oos: Date.now() }, ''); } catch (e) {} }
function doBack() {
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT') { a.blur(); ($('searchbox').classList.remove('open'), $('nav').classList.remove('searching')); focusEl($('searchbtn')); return true; }
  if (menuOpen()) { closeMenu(); return true; }
  if (!$('chooser').hidden) { if (store.get('sec', null)) { $('chooser').hidden = true; focusEl(defaultFocus(scopeEl())); return true; } return false; }
  if (fullPlayer()) { if (TV && $('side').classList.contains('tv-open')) { toggleQueue(false); return true; } minimizePlayer(); return true; }
  if (!$('modalwrap').hidden) { closeDetail(); restoreFocus(); return true; }
  if (!$('page').hidden) { goHome(); if (KB()) setTimeout(() => focusEl($('links').querySelector('button.on') || $('bbplay'), { instant: true }), 30); return true; }
  // Home screen with a remote: Back jumps to the mini player when something is playing,
  // otherwise to the top menu. From the mini player it goes to the top menu; from the menu it leaves the app.
  if (KB()) {
    const inNav = a && a.closest('.nav'), inMini = a && a.closest('#player.mini');
    if (isMini() && !inMini && !inNav) { focusEl($('miniplay')); return true; }
    if (!inNav) { toTopMenu(); return true; }
    return false;
  }
  if (isMini()) { closePlayer(); return true; }
  return false;
}
window.addEventListener('popstate', () => { if (!doBack() && history.state && history.state.oos) history.back(); });

/* ---- TV player controls ---- */
function ytState() { try { return yt.getPlayerState(); } catch (e) { return -1; } }

  $('tvplay').innerHTML = (playing ? PAUSE_ICO : PLAY_ICO).replace(/ width="22" height="22"/, ''); $('tvplay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  const v = cur(); if (v) { const inL = myList.includes(v.id); $('tvlist').querySelector('span').textContent = inL ? 'In My List' : 'My List'; }
  if (isMini()) syncMini();

function tvTick() { try { const d = yt.getDuration() || 0, t = yt.getCurrentTime() || 0; $('tvprog').style.width = d ? (t / d * 100) + '%' : '0'; $('tvcur').textContent = fmt(Math.floor(t)); $('tvdur').textContent = fmt(Math.floor(d)); } catch (e) {} }

function mediaKey(k) {
  if ($('player').hidden) return false;
  if (k === 'pp') togglePlay(); else if (k === 'play') { try { yt.playVideo(); } catch (er) {} } else if (k === 'pause') { try { yt.pauseVideo(); } catch (er) {} }

/* ---- key handling ---- */

  }

if (!TV) {

}
