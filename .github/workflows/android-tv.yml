name: Build TV app

on:
  push:
    branches: [main, master]
    paths: ['android-tv/**', '.github/workflows/android-tv.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle -p android-tv assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp android-tv/app/build/outputs/apk/debug/app-debug.apk OutofStepTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OutofStepTV-apk
          path: OutofStepTV.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-${{ github.run_number }}
          name: OutofStep.tv TV app (build ${{ github.run_number }})
          body: |
            Install on Fire TV, Google TV or Android TV.
            Easiest: in the Downloader app on your TV, open nj908crew.github.io/tv/app
          files: OutofStepTV.apk
          make_latest: true
